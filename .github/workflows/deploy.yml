name: Deploy PW Generator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  code-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24
      - name: run prettier
        run: pnpm run format
      - name: run eslint
        run: pnpm run lint
      - name: Check git tree
        id: git-porcelain
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "dirty=true" >> $GITHUB_OUTPUT
          else
            echo "dirty=false" >> $GITHUB_OUTPUT
          fi
      - if: ${{ steps.git-porcelain.outputs.dirty == 'true' }}
        run: |
          git status --porcelain -z | while IFS= read -r -d '' record; do
            echo "::error::Dirty files"
            echo "::error file=${record:3}::"
          done   
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24
      - name: typecheck
        run: pnpm run typecheck

  build:
    needs: [code-format, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24
      - name: Build app
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        id: deployment
        with:
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
